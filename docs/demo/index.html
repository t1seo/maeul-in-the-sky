<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07100d" />
    <meta
      name="description"
      content="Compare Maeul in the Sky village presets using the same contribution history."
    />
    <title>Maeul in the Sky · Preset demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #07100d;
        --surface: rgba(17, 31, 26, 0.78);
        --surface-strong: #16251f;
        --line: rgba(202, 231, 217, 0.16);
        --text: #f2f7f4;
        --muted: #a9bcb2;
        --accent: #8ad7ad;
        --accent-ink: #082114;
        --glow: rgba(92, 202, 143, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 10%, var(--glow), transparent 34rem),
          radial-gradient(circle at 90% 60%, rgba(82, 153, 209, 0.1), transparent 30rem),
          var(--bg);
      }

      a {
        color: inherit;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0 56px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-size: clamp(2.4rem, 7vw, 5.6rem);
        font-weight: 760;
        letter-spacing: -0.055em;
        line-height: 0.96;
      }

      .lead {
        max-width: 680px;
        margin: 24px 0 36px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.65;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .presets,
      .mode-switch {
        display: flex;
        gap: 8px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(6, 15, 12, 0.66);
        backdrop-filter: blur(12px);
      }

      button {
        min-height: 42px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        color: var(--muted);
        background: transparent;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        color: var(--text);
        background: var(--surface-strong);
      }

      button[aria-pressed="true"] {
        color: var(--accent-ink);
        background: var(--accent);
        box-shadow: 0 4px 22px rgba(108, 221, 159, 0.2);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .preview {
        overflow: hidden;
        padding: clamp(8px, 2vw, 18px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(20px);
      }

      .preview img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
      }

      .details {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: start;
        margin-top: 22px;
      }

      .details h2 {
        margin: 0 0 6px;
        font-size: 1.2rem;
      }

      .details p {
        max-width: 640px;
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .cta {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 18px;
        border-radius: 11px;
        color: var(--accent-ink);
        background: var(--accent);
        font-weight: 750;
        text-decoration: none;
      }

      footer {
        display: flex;
        gap: 18px;
        margin-top: 56px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 700px) {
        main {
          padding-top: 42px;
        }

        .toolbar,
        .details {
          display: grid;
          grid-template-columns: 1fr;
        }

        .presets {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
        }

        .mode-switch {
          width: max-content;
        }

        button {
          padding: 0 11px;
        }

        .cta {
          width: max-content;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        button,
        .cta {
          transition:
            color 160ms ease,
            background-color 160ms ease,
            transform 160ms ease;
        }

        .cta:hover {
          transform: translateY(-2px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Interactive preset demo</p>
      <h1>One history.<br />Three villages.</h1>
      <p class="lead">
        The contribution history stays fixed while the village density changes. Choose a preset to
        see how much nature or civilization you want in your profile.
      </p>

      <div class="toolbar">
        <div class="presets" aria-label="Village preset">
          <button type="button" data-preset="nature" aria-pressed="false">Nature</button>
          <button type="button" data-preset="balanced" aria-pressed="true">Balanced</button>
          <button type="button" data-preset="civilization" aria-pressed="false">
            Civilization
          </button>
        </div>
        <div class="mode-switch" aria-label="Color mode">
          <button type="button" data-mode="dark" aria-pressed="true">Dark</button>
          <button type="button" data-mode="light" aria-pressed="false">Light</button>
        </div>
      </div>

      <div class="preview" aria-live="polite">
        <img
          id="terrain"
          src="assets/preset-balanced-dark.svg"
          width="840"
          height="240"
          alt="Balanced Maeul in the Sky terrain in dark mode"
        />
      </div>

      <section class="details" aria-labelledby="preset-name">
        <div>
          <h2 id="preset-name">Balanced</h2>
          <p id="preset-description">A mix of nature, farms, villages, and cities.</p>
        </div>
        <a class="cta" href="https://github.com/t1seo/maeul-in-the-sky#quick-start">
          Build your village
        </a>
      </section>

      <footer>
        <a href="https://github.com/t1seo/maeul-in-the-sky">GitHub</a>
        <a href="https://www.npmjs.com/package/maeul-in-the-sky">npm</a>
      </footer>
    </main>

    <script>
      const presets = {
        nature: {
          name: 'Nature',
          description: 'Fewer buildings, with more forests and open terrain.',
        },
        balanced: {
          name: 'Balanced',
          description: 'A mix of nature, farms, villages, and cities.',
        },
        civilization: {
          name: 'Civilization',
          description: 'More buildings across everyday contribution levels.',
        },
      };
      const query = new URLSearchParams(window.location.search);
      let preset = presets[query.get('preset')] ? query.get('preset') : 'balanced';
      let mode = ['dark', 'light'].includes(query.get('mode'))
        ? query.get('mode')
        : window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';
      const terrain = document.querySelector('#terrain');
      const presetName = document.querySelector('#preset-name');
      const presetDescription = document.querySelector('#preset-description');

      function render() {
        terrain.src = `assets/preset-${preset}-${mode}.svg`;
        terrain.alt = `${presets[preset].name} Maeul in the Sky terrain in ${mode} mode`;
        presetName.textContent = presets[preset].name;
        presetDescription.textContent = presets[preset].description;
        document.querySelectorAll('[data-preset]').forEach((button) => {
          button.setAttribute('aria-pressed', button.dataset.preset === preset);
        });
        document.querySelectorAll('[data-mode]').forEach((button) => {
          button.setAttribute('aria-pressed', button.dataset.mode === mode);
        });
        const nextQuery = new URLSearchParams({ preset, mode });
        window.history.replaceState({}, '', `${window.location.pathname}?${nextQuery}`);
      }

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => {
          preset = button.dataset.preset;
          render();
        });
      });
      document.querySelectorAll('[data-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          mode = button.dataset.mode;
          render();
        });
      });
      render();
    </script>
  </body>
</html>
