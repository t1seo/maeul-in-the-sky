name: 'Maeul in the Sky - Contribution Village Generator'
description: 'Build an animated isometric village from a GitHub Contribution Calendar'
branding:
  icon: 'map'
  color: 'green'
inputs:
  username:
    description: 'GitHub user whose Contribution Calendar is used (defaults to repository owner)'
    required: false
    default: '${{ github.repository_owner }}'
  github_token:
    description: 'GitHub token for API access'
    required: false
    default: '${{ github.token }}'
  theme:
    description: 'Theme name (terrain)'
    required: false
    default: 'terrain'
  title:
    description: 'Custom title text'
    required: false
  output_dir:
    description: 'Output directory for SVG files'
    required: false
    default: './'
  year:
    description: 'Target year to visualize'
    required: false
  hemisphere:
    description: 'Hemisphere for seasonal terrain (north or south)'
    required: false
    default: 'north'
  preset:
    description: 'Village preset (nature, balanced, or civilization)'
    required: false
    default: 'balanced'
  density:
    description: 'Advanced building density override from 1-10'
    required: false
outputs:
  dark_svg_path:
    description: 'Path to the generated dark mode SVG'
  light_svg_path:
    description: 'Path to the generated light mode SVG'
runs:
  using: 'node24'
  main: 'dist/action.cjs'
