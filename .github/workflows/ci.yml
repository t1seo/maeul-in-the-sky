name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:pixel
      - run: npm run check:catalog
      - run: npx vitest run --coverage --maxWorkers=2
        env:
          MAEUL_MOTION_HEADED: '0'

  artifact:
    name: Package Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:artifact
      - name: Verify committed runtime bundles
        run: |
          git diff --exit-code -- dist docs/demo/app docs/demo/world/app docs/demo/versions
          test -z "$(git ls-files --others --exclude-standard dist docs/demo/app docs/demo/world/app docs/demo/versions)"

  profile:
    name: 3D Profile Capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Capture a complete seasonal circle with the optional Action
        uses: ./profile
        with:
          snapshot_path: tests/fixtures/improvements/mixed-2025.json
          output_dir: test-results/profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-season-circle-profile
          path: test-results/profile/
          retention-days: 14

  browser_projects:
    name: Browser Regression (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - chromium-mobile
          - chromium-reduced
          - firefox-desktop
          - firefox-mobile
          - firefox-reduced
          - webkit-desktop
          - webkit-mobile
          - webkit-reduced
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-traces-and-static-approval-images-linux-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 14

  browser:
    name: Browser Regression
    needs: browser_projects
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all nine browser projects
        env:
          BROWSER_RESULT: ${{ needs.browser_projects.result }}
        run: test "$BROWSER_RESULT" = success

  pixels:
    name: Approved Static Images
    runs-on: macos-15
    timeout-minutes: 15
    env:
      MAEUL_VISUAL_BASELINE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npx playwright test tests/visual/static.spec.ts tests/visual/world-static.spec.ts --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-static-image-diffs-macos
          path: |
            playwright-report/
            test-results/browser/
          retention-days: 14

  benchmark:
    name: Renderer Budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark -- --warmup 20 --iterations 100 --output test-results/benchmark/current.json --baseline tests/fixtures/benchmark-baseline.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-benchmark-samples-and-budget-results
          path: test-results/benchmark/
          retention-days: 14

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
