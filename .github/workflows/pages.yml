name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/demo/**'
      - 'scripts/generate-demo.ts'
      - 'scripts/build-demo.ts'
      - 'scripts/build-world.ts'
      - 'scripts/build-terrain-lab.ts'
      - 'scripts/generate-landscape.ts'
      - 'scripts/generate-catalog.ts'
      - 'scripts/catalog/**'
      - 'src/**'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:demo
      - run: npm run generate:landscape
      - run: npm run generate:catalog
      - run: npm run check:catalog
      - name: Verify enhanced demo and static fallback assets
        run: |
          test -s docs/demo/app/main.js
          test -s docs/demo/world/index.html
          test -s docs/demo/world/app/main.js
          test -s docs/demo/catalog/index.html
          test -s docs/demo/catalog/catalog.json
          test -s docs/demo/catalog/wonders.html
          test -s docs/demo/landscape/index.html
          test -s docs/demo/terrain-lab/index.html
          test -s docs/demo/terrain-lab/app/main.js
          for landform in island archipelago valley; do
            for mode in dark light; do
              test -s "docs/demo/landscape/assets/$landform-$mode.svg"
            done
          done
          for preset in nature balanced civilization; do
            for mode in dark light; do
              test -s "docs/demo/assets/preset-$preset-$mode.svg"
            done
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/demo
      - id: deployment
        uses: actions/deploy-pages@v5
